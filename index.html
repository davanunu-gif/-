<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח בית כנסת - שביל התפילה</title>

  <!-- גופנים תורניים ומודרניים -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Hofshi:wght@700;900&family=Rubik:wght@700;900&display=swap" rel="stylesheet">

  <!-- ספריית Hebcal לחישוב תאריך עברי אופליין -->
  <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@5.7.0/dist/bundle.min.js"></script>

  <style>
    :root {
      --top-bg: #1b263b;
      --bottom-bg: #0d1b2a;
      --clock-color: #f4e3be;
      --text-color: #2b1e1a;
      --gold-primary: #e0a96d;
      --parchment: #fefae0;
      --scroll-duration: 20s;
      --clock-size: 15rem; /* גודל ברירת מחדל */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Frank Ruhl Hofshi', 'Rubik', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bottom-bg);
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    /* החלק העליון: 60% מהמסך */
    .top-section {
      height: 60vh;
      background-color: var(--top-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 30px;
      border-bottom: 6px solid var(--gold-primary);
      box-shadow: 0 10px 0px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .synagogue-title {
      font-size: 2.2rem;
      background: var(--gold-primary);
      color: #000;
      padding: 6px 35px;
      border-radius: 0 0 12px 12px;
      font-weight: 900;
      box-shadow: 0 4px 0px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .clock-display {
      font-family: 'Rubik', sans-serif;
      font-size: var(--clock-size);
      font-weight: 900;
      color: var(--clock-color);
      line-height: 0.85;
      letter-spacing: 4px;
      text-shadow: 6px 6px 0px rgba(0, 0, 0, 0.6);
      margin: auto 0;
      transition: font-size 0.3s ease;
    }

    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 95%;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 8px 25px;
      font-size: 2rem;
      color: var(--clock-color);
      box-shadow: 0 4px 0px rgba(0, 0, 0, 0.2);
    }

    .date-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .divider {
      color: var(--gold-primary);
    }

    /* החלק התחתון: 40% מהמסך */
    .bottom-section {
      height: 40vh;
      padding: 15px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bottom-bg);
    }

    .board-container {
      width: 100%;
      height: 100%;
      background-color: var(--parchment);
      border: 4px solid var(--gold-primary);
      border-radius: 12px;
      padding: 20px 30px;
      box-shadow: 8px 8px 0px var(--gold-primary);
      display: flex;
      flex-direction: column;
    }

    .board-header {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      color: #000;
      border-bottom: 3px solid var(--gold-primary);
      padding-bottom: 8px;
      margin-bottom: 10px;
      z-index: 2;
    }

    .announcement-container {
      flex-grow: 1;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .announcement-text {
      position: absolute;
      width: 100%;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text-color);
      white-space: pre-wrap;
      line-height: 1.5;
      text-align: center;
      animation: scrollUp var(--scroll-duration) linear infinite;
    }

    @keyframes scrollUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }

    .edit-btn {
      position: fixed;
      bottom: 15px;
      left: 15px;
      background: var(--gold-primary);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      box-shadow: 3px 3px 0px #000;
      opacity: 0.6;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .edit-btn:hover { opacity: 1; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #ffffff;
      color: #000;
      border: 4px solid var(--gold-primary);
      border-radius: 12px;
      padding: 25px;
      width: 80%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      direction: rtl;
    }

    .control-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .control-group label { font-weight: bold; }
    .control-group input, .control-group select, .control-group textarea {
      padding: 8px; border: 2px solid #ccc; border-radius: 6px; font-size: 1rem;
    }
    .btn-save {
      background: var(--gold-primary); color: #000; padding: 12px;
      border: none; border-radius: 6px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-section" id="top-section">
    <div class="synagogue-title" id="synagogue-name">בית כנסת שביל התפילה | לעילוי נשמת שמואל בן רחל ונונו</div>

    <div class="clock-display" id="clock">00:00:00</div>

    <div class="date-bar" id="date-bar">
      <div class="date-item" id="day-name">יום ראשון</div>
      <div class="divider">♦</div>
      <div class="date-item" id="hebrew-date">טוען תאריך עברי...</div>
      <div class="divider">♦</div>
      <div class="date-item" id="gregorian-date">00/00/0000</div>
    </div>
  </div>

  <div class="bottom-section" id="bottom-section">
    <div class="board-container">
      <div class="board-header">📜 הודעות וזמני תפילות</div>
      <div class="announcement-container">
        <div class="announcement-text" id="announcement-text">
          טוען הודעות מ-Google Sheets...
        </div>
      </div>
    </div>
  </div>

  <button class="edit-btn" onclick="openModal()">✏️ הגדרות עיצוב ותוכן</button>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2>הגדרות תצוגה</h2>
      <div class="control-group">
        <label>שם בית הכנסת / הקדשה:</label>
        <input type="text" id="input-header" value="בית כנסת שביל התפילה | לעילוי נשמת שמואל בן רחל ונונו">
      </div>
      <div class="control-group">
        <label>גודל גופן השעון:</label>
        <select id="input-clock-size">
          <option value="12rem">גודל רגיל (12)</option>
          <option value="14rem">גודל 14</option>
          <option value="15rem" selected>גודל 15 (גדול מומלץ)</option>
          <option value="18rem">גודל ענק (18)</option>
        </select>
      </div>
      <div class="control-group">
        <label>תוכן ההודעות המקומי (גיבוי אופליין):</label>
        <textarea id="input-text" rows="5"></textarea>
      </div>
      <button class="btn-save" onclick="saveSettings()">שמור וסגור</button>
    </div>
  </div>

  <script>
    const DEFAULT_HEADER = "בית כנסת שביל התפילה | לעילוי נשמת שמואל בן רחל ונונו";
    const SHEET_ID = '1WTe0dL7J81bxPuUQAJU1O-q1QEzswA9F4JadbE5I_KE';

    function numToGematria(num) {
      const letters = [
        "", "א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ז'", "ח'", "ט'", "י'",
        "י\"א", "י\"ב", "י\"ג", "י\"ד", "ט\"ו", "ט\"ז", "י\"ז", "י\"ח", "י\"ט", "כ'",
        "כ\"א", "כ\"ב", "כ\"ג", "כ\"ד", "כ\"ה", "כ\"ו", "כ\"ז", "כ\"ח", "כ\"ט", "ל'"
      ];
      return letters[num] || String(num);
    }

    const hebrewMonthsMap = {
      "Tishrei": "תשרי", "Cheshvan": "חשוון", "Kislev": "כסלו", "Tevet": "טבת",
      "Shevat": "שבט", "Adar": "אדר", "Adar I": "אדר א'", "Adar II": "אדר ב'",
      "Nisan": "ניסן", "Iyyar": "אייר", "Sivan": "סיון", "Tamuz": "תמוז",
      "Av": "אב", "Elul": "אלול"
    };

    function updateClockAndDates() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;

      const days = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'שבת קודש'];
      document.getElementById('day-name').textContent = days[now.getDay()];

      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      document.getElementById('gregorian-date').textContent = `${day}/${month}/${year}`;

      let hebrewDateStr = "";
      try {
        if (window.hebcal && window.hebcal.HDate) {
          const hdate = new window.hebcal.HDate(now);
          const dayGematria = numToGematria(hdate.getDate());
          const rawMonth = hdate.getMonthName();
          const monthHebrew = hebrewMonthsMap[rawMonth] || hdate.getMonthName('he');
          hebrewDateStr = `${dayGematria} ב${monthHebrew}`;
        }
      } catch (e) {
        hebrewDateStr = "טוען תאריך עברי...";
      }
      document.getElementById('hebrew-date').textContent = hebrewDateStr;
    }

    updateClockAndDates();
    setInterval(updateClockAndDates, 1000);

    // משיכת נתונים מ-Google Sheets (JSONP)
    function fetchRemoteNotices() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetData&nocache=${Date.now()}`;
      const oldScript = document.getElementById('gdrive-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gdrive-script';
      script.src = url;
      document.body.appendChild(script);
    }

    function handleSheetData(data) {
      try {
        const rows = data.table.rows;
        const lines = [];

        rows.forEach(row => {
          if (row.c && row.c[0] && row.c[0].v !== null && row.c[0].v !== undefined) {
            lines.push(row.c[0].v);
          }
        });

        if (lines.length > 0) {
          const newNotice = lines.join('\n');
          localStorage.setItem('syn_text', newNotice);
          document.getElementById('announcement-text').innerText = newNotice;
          document.getElementById('input-text').value = newNotice;
        }
      } catch (e) {
        console.log("Error parsing sheet data:", e);
      }
    }

    function loadSettings() {
      const header = localStorage.getItem('syn_header') || DEFAULT_HEADER;
      const text = localStorage.getItem('syn_text') || 'טוען מודעות...';
      const clockSize = localStorage.getItem('syn_clock_size') || '15rem';

      document.getElementById('synagogue-name').innerText = header;
      document.getElementById('announcement-text').innerText = text;
      document.getElementById('input-header').value = header;
      document.getElementById('input-text').value = text;
      document.getElementById('input-clock-size').value = clockSize;

      document.documentElement.style.setProperty('--clock-size', clockSize);
    }

    function openModal() { document.getElementById('editModal').style.display = 'flex'; }
    function saveSettings() {
      const selectedClockSize = document.getElementById('input-clock-size').value;
      localStorage.setItem('syn_header', document.getElementById('input-header').value);
      localStorage.setItem('syn_text', document.getElementById('input-text').value);
      localStorage.setItem('syn_clock_size', selectedClockSize);
      
      loadSettings();
      document.getElementById('editModal').style.display = 'none';
    }

    loadSettings();
    fetchRemoteNotices();
    setInterval(fetchRemoteNotices, 2 * 60 * 1000); // בדיקה כל 2 דקות
  </script>
</body>
</html>
